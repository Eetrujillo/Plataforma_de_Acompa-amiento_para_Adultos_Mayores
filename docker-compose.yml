services:
  mongo:
    image: mongo:7
    container_name: mearn-mongo
    restart: unless-stopped
    # Standalone mongod on purpose: the application never opens multi-document
    # transactions, which is the only Prisma feature that requires a replica set.
    # If transactions are ever added, start with --replSet plus a real
    # rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) and add
    # ?replicaSet=rs0 to MONGO_URL. A declared but uninitiated set has no primary
    # and every query fails with ReplicaSetNoPrimary.
    environment:
      MONGO_INITDB_DATABASE: mearn_db
    ports:
      - "4301:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - mearn-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mearn-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Mongo is the only datastore, so the Prisma URL is derived from MONGO_URL.
      # Setting it explicitly also overrides a stale DATABASE_URL left in .env by
      # another project (the Prisma CLI reads the variable raw and rejects it).
      - DATABASE_URL=${MONGO_URL:-mongodb://mongo:27017/mearn_db}
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017/mearn_db}
      # Fixed on purpose: nginx proxies to backend:3500 and the image EXPOSEs 3500.
      # Only the published host port is configurable (BACKEND_PORT).
      - BACKEND_INTERNAL_PORT=3500
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3500}:3500"
    # The container runs the built image: no bind mount and no anonymous volume
    # in front of node_modules, so what was built is exactly what runs.
    networks:
      - mearn-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mearn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # The SPA is compiled at image build time and served by nginx, which also
    # proxies /api and /socket.io to the backend service.
    ports:
      - "3201:3201"
    networks:
      - mearn-net

networks:
  mearn-net:
    driver: bridge

volumes:
  mongo_data:
