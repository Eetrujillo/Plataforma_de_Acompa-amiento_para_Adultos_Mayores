services:
  mongo:
    image: mongo:7
    container_name: mearn-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: mearn_db
    ports:
      - "4301:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - mearn-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mearn-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Defaults keep the stack bootable even before .env is filled in; the
      # env_file above supplies the real values (including the JWT secret).
      - DATABASE_URL=${DATABASE_URL:-mongodb://mongo:27017/mearn_db}
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017/mearn_db}
      - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT:-3500}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3500}:${BACKEND_INTERNAL_PORT:-3500}"
    # The container runs the built image: no bind mount and no anonymous volume
    # in front of node_modules, so what was built is exactly what runs.
    networks:
      - mearn-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mearn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # The SPA is compiled at image build time and served by nginx, which also
    # proxies /api and /socket.io to the backend service.
    ports:
      - "3201:3201"
    networks:
      - mearn-net

networks:
  mearn-net:
    driver: bridge

volumes:
  mongo_data:
