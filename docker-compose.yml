services:
  mongo:
    image: mongo:7
    container_name: mearn-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: mearn_db
    ports:
      - "4301:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mearn-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mearn-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017/mearn_db}
      - JWT_SECRET=${JWT_SECRET:-dev-only-secret-change-me}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - APP_URL=${APP_URL:-http://localhost:3201}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - LINK_QR_BASE_URL=${LINK_QR_BASE_URL:-acompanamiento://vincular}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3505}:3701"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3701/api/health"]
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mearn-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: mearn-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3201:80"
    networks:
      - mearn-net

networks:
  mearn-net:
    driver: bridge

volumes:
  mongo_data:
