services:
  postgres:
    image: postgres:16
    container_name: mearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mearn_db
      POSTGRES_USER: mearn_user
      POSTGRES_PASSWORD: mearn_password
    ports:
      - "4301:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - mearn-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mearn_user -d mearn_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: mearn-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:${BACKEND_INTERNAL_PORT}"
    networks:
      - mearn-net

networks:
  mearn-net:
    driver: bridge

volumes:
  postgres_data: