<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login V2 — Dirección 2: Tarjeta cálida con escena superior</title>
<style>
  :root {
    --bg: #f4f7fa; --surface: #ffffff; --ink: #10202b; --ink-soft: #3d5262;
    --primary: #0f3d5c; --primary-strong: #0a2b42; --accent: #1f7a8c;
    --warm: #fbeed7; --warm-soft: #fdf6e9; --gold: #f2b134;
    --danger: #b3261e; --border: #c8d6e0;
    --radius-md: 12px; --radius-lg: 20px; --radius-xl: 28px;
    --shadow: 0 6px 18px rgba(16, 32, 43, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 20px; line-height: 1.55; color: var(--ink);
    background:
      radial-gradient(circle at 12% 18%, var(--warm) 0, transparent 38%),
      radial-gradient(circle at 88% 82%, rgba(31, 122, 140, 0.12) 0, transparent 40%),
      var(--bg);
  }
  .auth { width: min(480px, 100%); }
  .card { background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow); overflow: hidden; border: 1px solid rgba(200, 214, 224, 0.6); }

  .hero {
    position: relative; text-align: center; padding: 1.6rem 2rem 1.2rem;
    background: linear-gradient(180deg, var(--warm) 0%, var(--warm-soft) 100%);
  }
  .hero .logo { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 800; color: var(--primary); font-size: 1rem; }
  .hero .logo svg { display: block; border-radius: 10px; }
  .hero img { display: block; width: min(200px, 50vw); margin: 0.5rem auto 0.3rem; height: auto; }
  .hero figcaption { font-size: 0.9rem; color: var(--ink-soft); margin: 0; }
  .hero figcaption strong { color: var(--primary); }

  .body { padding: 1.5rem 2rem 2rem; }
  .body h1 { margin: 0 0 0.25rem; font-size: 1.7rem; color: var(--primary); }
  .body .sub { margin: 0 0 1.3rem; color: var(--ink-soft); font-size: 0.95rem; }

  .field { display: grid; gap: 0.35rem; margin-bottom: 1rem; }
  .field label { font-weight: 700; font-size: 0.92rem; }
  .field input {
    width: 100%; min-height: 56px; padding: 0.6rem 1rem;
    border: 1.5px solid #ece2cf; border-radius: var(--radius-md);
    background: #fdfcf9; font: inherit; color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(31, 122, 140, 0.15); }

  .meta { display: flex; justify-content: space-between; align-items: center; margin: 0.2rem 0 1.2rem; flex-wrap: wrap; gap: 0.5rem; }
  .remember { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.92rem; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .remember input { width: 20px; height: 20px; accent-color: var(--primary); }
  .link { color: var(--accent); font-weight: 700; font-size: 0.92rem; text-decoration-thickness: 2px; text-underline-offset: 3px; }

  .btn {
    width: 100%; min-height: 56px; border-radius: var(--radius-md); border: 2px solid var(--primary);
    background: var(--primary); color: #fff; font: inherit; font-weight: 800; cursor: pointer;
    box-shadow: 0 6px 14px rgba(15, 61, 92, 0.2);
  }
  .btn:hover { background: var(--primary-strong); border-color: var(--primary-strong); }
  .btn:active { transform: translateY(1px); box-shadow: none; }

  .divider { display: flex; align-items: center; gap: 0.8rem; margin: 1.2rem 0 0.9rem; color: var(--ink-soft); font-size: 0.85rem; font-weight: 600; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #eee3cd; }

  .google {
    display: flex; align-items: center; justify-content: center; gap: 0.7rem;
    width: 100%; min-height: 54px; border-radius: var(--radius-md);
    border: 2px solid var(--border); background: #fff; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer;
  }
  .google:hover { background: var(--warm-soft); }

  .foot { padding: 1rem 2rem 1.4rem; text-align: center; background: #fffdf8; border-top: 1px solid #f3e8d2; color: var(--ink-soft); font-size: 0.95rem; }
  .foot a { color: var(--accent); font-weight: 700; }
  a:focus-visible, .btn:focus-visible, .google:focus-visible, input:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

  @media (max-width: 560px) {
    .hero, .body, .foot { padding-inline: 1.4rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <main class="auth">
    <div class="card">
      <figure class="hero" style="margin:0">
        <div class="logo">
          <svg width="34" height="34" viewBox="0 0 512 512" role="img" aria-label="GAP">
            <rect width="512" height="512" rx="96" fill="#0f3d5c"/>
            <circle cx="256" cy="168" r="62" fill="#ffffff"/>
            <path d="M256 250c-74 0-134 60-134 134v28h268v-28c0-74-60-134-134-134z" fill="#ffffff"/>
            <path d="M366 118c-22 0-40 18-40 40 0 30 40 62 40 62s40-32 40-62c0-22-18-40-40-40z" fill="#f2b134"/>
          </svg>
          GAP
        </div>
        <img src="../login/.assets/abuelitos-abrazados.jpeg" alt="Pareja de abuelitos abrazados">
        <figcaption><strong>Jamás estás lejos</strong> de quien más querés.</figcaption>
      </figure>

      <form class="body" novalidate>
        <h1>Bienvenido de nuevo</h1>
        <p class="sub">Ingresá con tu cuenta para continuar.</p>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
        </div>
        <div class="field">
          <label for="pass">Contraseña</label>
          <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <div class="meta">
          <label class="remember"><input type="checkbox" checked> Recordarme</label>
          <a class="link" href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <button class="btn" type="submit">Iniciar sesión</button>

        <p class="divider">o continuá con</p>
        <button class="google" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/>
            <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.8V6.5H1.4a12 12 0 0 0 0 11z"/>
            <path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.5 1.8l3.4-3.4A12 12 0 0 0 1.4 6.5l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/>
          </svg>
          Continuar con Google
        </button>
      </form>
    </div>
    <footer class="foot" style="border-radius:0 0 var(--radius-xl) var(--radius-xl)">
      ¿No tienes una cuenta? <a href="#">Registrate</a>
    </footer>
  </main>
</body>
</html>
